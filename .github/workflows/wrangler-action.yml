name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # build.js e o gerador da tabela usam apenas a stdlib do Node,
      # e a wrangler-action instala a própria wrangler — nenhum install aqui.
      - name: Check readme is in sync with ./icons
        run: node scripts/readme-table.mjs --check

      - name: Check token contrast (AA)
        run: node scripts/contraste.mjs --check

      - name: Check icon normalization
        run: node scripts/normalizar-icones.mjs --check

      - name: Build
        run: node build.js

      # Não publica nada — só garante que o site ainda compõe. Um partial
      # renomeado ou uma página sem o bloco <!--pagina--> quebraria aqui, e não
      # no deploy da Vercel.
      - name: Build the site
        run: node scripts/vercel-assets.mjs && node scripts/build-pages.mjs

      # O projeto passou a ser hospedado na Vercel. Sem os secrets do
      # Cloudflare este passo é pulado, em vez de falhar para sempre.
      - name: Publish
        if: ${{ secrets.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
