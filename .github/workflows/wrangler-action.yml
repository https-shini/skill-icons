name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # build.js e o gerador da tabela usam apenas a stdlib do Node,
      # e a wrangler-action instala a própria wrangler — nenhum install aqui.
      - name: Check readme is in sync with ./icons
        run: node scripts/readme-table.mjs --check

      - name: Build
        run: node build.js

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
